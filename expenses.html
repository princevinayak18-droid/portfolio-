<!DOCTYPE html>
<html>
<head>
<title>Project 8 - Expense Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#0f172a;color:white;padding:20px;max-width:600px;margin:auto}
.card{background:#1e293b;padding:20px;border-radius:12px;margin:10px 0}
input,select{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none}
button{background:#22c55e;color:white;padding:12px;width:100%;border:none;border-radius:8px;font-size:16px;cursor:pointer}
.item{display:flex;justify-content:space-between;background:#334155;padding:12px;border-radius:8px;margin:8px 0}
.del{background:#ef4444;padding:6px 12px;width:auto}
h1{color:#22c55e} .total{font-size:28px;color:#facc15}
a{color:#60a5fa}
</style>
</head>
<body>
<h1>💰 Project 8: Expense Tracker</h1>
<a href="/">← Back to Portfolio</a>
<div class="card">
<h3>Total Spent: <span class="total" id="total">₹0</span></h3>
<p id="count">Loading...</p>
</div>
<div class="card">
<input id="title" placeholder="What did you spend on? Ex: Lunch">
<input id="amount" type="number" placeholder="Amount ₹">
<select id="category"><option>Food</option><option>Travel</option><option>Study</option><option>General</option></select>
<button onclick="addExpense()">+ Add Expense</button>
</div>
<div id="list"></div>

<script>
async function load(){
  let r = await fetch('/api/expenses');
  let d = await r.json();
  document.getElementById('total').innerText = '₹' + d.total;
  document.getElementById('count').innerText = d.count + ' expenses';
  document.getElementById('list').innerHTML = d.expenses.map(e=>`
    <div class="item"><span><b>${e.title}</b><br><small>${e.category} - ₹${e.amount}</small></span>
    <button class="del" onclick="delExpense(${e.id})">Delete</button></div>`).join('');
}
async function addExpense(){
  let title=document.getElementById('title').value;
  let amount=document.getElementById('amount').value;
  let category=document.getElementById('category').value;
  await fetch('/api/expenses',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,amount,category})});
  document.getElementById('title').value=''; document.getElementById('amount').value='';
  load();
}
async function delExpense(id){
  await fetch('/api/expenses?id='+id,{method:'DELETE'});
  load();
}
load();
</script>
</body>
</html>
