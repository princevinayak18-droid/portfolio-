name: Daily Health Check
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Health Check
        run: |
          chmod +x projects/02-linux-health/health-check.sh
          bash projects/02-linux-health/health-check.sh
